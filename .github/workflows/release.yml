# Build platform wheels + sdist and publish to PyPI.
#
# Adapted from `maturin generate-ci github`, trimmed to the platforms that
# matter for this library and switched to PyPI Trusted Publishing (OIDC) so
# there is no API token to store as a secret.
#
# Triggers:
#   - push a tag `vX.Y.Z`     -> build everything, publish to PyPI
#   - manual (workflow_dispatch, dry_run=true) -> build everything, publish to
#     TestPyPI (no clean tag required; good for rehearsing a release)
#
# ONE-TIME SETUP (per index) before the first run — register this workflow as a
# trusted publisher so OIDC works with no token:
#   PyPI:     https://pypi.org/manage/account/publishing/
#   TestPyPI: https://test.pypi.org/manage/account/publishing/
#   Project: latincy-preprocess | Owner: latincy | Repo: latincy-preprocess
#   Workflow: release.yml | Environment: pypi  (and testpypi for the dry-run)

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Publish to TestPyPI instead of PyPI'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # abi3 build (rust/Cargo.toml enables pyo3 "abi3-py310"): maturin emits
          # ONE stable-ABI wheel (cp310-abi3-*) that loads on CPython 3.10+,
          # including CPythons released after this build. So a single interpreter
          # suffices — no --find-interpreter, no per-version matrix, and new
          # Python releases need no rebuild.
          args: --release --out dist
          manylinux: auto
          sccache: 'true'
      - name: Smoke-test wheel (native x86_64 only)
        if: matrix.target == 'x86_64'
        shell: bash
        run: |
          set -e
          python -m venv .venv && source .venv/bin/activate
          pip install latincy-preprocess --no-index --find-links dist --force-reinstall
          python -c "import latincy_preprocess as l; assert l.normalize_uv('voluitque') == 'voluitque'; assert l.beta_to_unicode('lo/gos') == 'λόγος'; print('ok', l.__version__, l.backend())"
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    runs-on: macos-14
    strategy:
      matrix:
        target: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: 'true'
      - name: Smoke-test wheel (native arm64 only)
        if: matrix.target == 'aarch64'
        shell: bash
        run: |
          set -e
          python -m venv .venv && source .venv/bin/activate
          pip install latincy-preprocess --no-index --find-links dist --force-reinstall
          python -c "import latincy_preprocess as l; assert l.normalize_uv('voluitque') == 'voluitque'; print('ok', l.__version__, l.backend())"
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
          sccache: 'true'
      - name: Smoke-test wheel
        shell: bash
        run: |
          set -e
          python -m venv .venv && source .venv/Scripts/activate
          pip install latincy-preprocess --no-index --find-links dist --force-reinstall
          python -c "import latincy_preprocess as l; assert l.normalize_uv('voluitque') == 'voluitque'; print('ok', l.__version__, l.backend())"
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-windows-x64
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'to TestPyPI' || 'to PyPI' }}
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    # Pick the environment so the matching trusted-publisher config is used.
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write   # OIDC token for Trusted Publishing — no API token needed
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Check distributions
        run: pipx run twine check --strict dist/*
      - name: Publish to TestPyPI
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: pypa/gh-action-pypi-publish@release/v1
