[package]
name = "latincy-preprocess"
version = "0.3.3"
edition = "2021"

[lib]
name = "latincy_preprocess"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = []
pyo3-backend = ["dep:pyo3"]
cli = ["dep:clap", "dep:rayon", "dep:glob"]

[dependencies]
# abi3-py310: build a single stable-ABI extension that loads on CPython 3.10+
# (including Python versions released after this crate is built), so one wheel
# per platform covers the whole supported range and every future CPython.
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py310"], optional = true }
serde_json = "1"
clap = { version = "4", features = ["derive"], optional = true }
rayon = { version = "1.10", optional = true }
glob = { version = "0.3", optional = true }

[profile.release]
opt-level = 3
lto = true
